<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Dost — Farmer's Friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --soil:#2F3B25;
    --paper:#F6F2E7;
    --wheat:#C99A3B;
    --leaf:#4C6E3F;
    --water:#2B6CB0;
    --alert:#B4502A;
    --ink:#26301E;
    --line: rgba(38,48,30,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:36px 20px 80px;}
  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--soil);
    padding-bottom:14px; margin-bottom:28px;
  }
  .wordmark{font-family:'Fraunces', serif; font-weight:700; font-size:34px; letter-spacing:-0.01em;}
  .wordmark span{color:var(--leaf);}
  .datestamp{font-size:13px; color:var(--soil); opacity:0.75; text-align:right; line-height:1.4;}
  .language-switch{display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px;}
  .language-switch select{border:1px solid var(--line); background:var(--paper); color:var(--soil); padding:3px 6px; font:inherit;}

  .setup{border:1px solid var(--line); background:#fff; padding:24px; margin-bottom:24px;}
  .setup h2{font-family:'Fraunces', serif; font-size:20px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--soil); margin-bottom:4px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); background:var(--paper);
    font-family:'Work Sans', sans-serif; font-size:14px;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  button{
    background:var(--soil); color:var(--paper); border:none; padding:11px 18px;
    font-family:'Work Sans', sans-serif; font-size:14px; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--leaf);}
  button.secondary{background:transparent; color:var(--soil); border:1px solid var(--soil);}

  .headline-card{
    border:1px solid var(--line); background:#fff; padding:0; margin-bottom:20px; overflow:hidden;
  }
  .headline-bar{padding:6px 20px; font-size:12px; letter-spacing:0.02em; color:#fff;}
  .headline-bar.critical, .headline-bar.high{background:var(--alert);}
  .headline-bar.medium{background:var(--wheat); color:var(--soil);}
  .headline-bar.low, .headline-bar.none{background:var(--leaf);}
  .headline-body{padding:22px 20px 26px;}
  .headline-body h1{font-family:'Fraunces', serif; font-size:26px; line-height:1.3; margin:0 0 8px; font-weight:600;}
  .headline-body p{margin:0; color:var(--soil); font-size:14px;}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-top:none; background:#fff; margin-bottom:24px;}
  .stat{padding:16px 18px; border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .k{font-size:11px; color:var(--soil); opacity:0.7; margin-bottom:6px;}
  .stat .v{font-family:'Fraunces', serif; font-size:19px; font-weight:600;}

  .stage-track{display:flex; border:1px solid var(--line); margin-bottom:28px; background:#fff;}
  .stage-seg{flex:1; padding:12px 8px; text-align:center; font-size:11px; border-right:1px solid var(--line); color:var(--soil); opacity:0.55;}
  .stage-seg:last-child{border-right:none;}
  .stage-seg.active{background:var(--leaf); color:#fff; opacity:1; font-weight:600;}
  .stage-seg.done{opacity:0.85; text-decoration:line-through;}

  .chat{border:1px solid var(--line); background:#fff;}
  .chat h2{font-family:'Fraunces', serif; font-size:18px; margin:0; padding:16px 20px; border-bottom:1px solid var(--line);}
  .log{height:280px; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px;}
  .msg{max-width:82%; padding:9px 13px; font-size:14px; line-height:1.45;}
  .msg.user{align-self:flex-end; background:var(--soil); color:var(--paper);}
  .msg.bot{align-self:flex-start; background:var(--paper); border:1px solid var(--line);}
  .composer{display:flex; border-top:1px solid var(--line);}
  .composer input{flex:1; border:none; padding:14px 18px; font-family:'Work Sans',sans-serif; font-size:14px; background:transparent;}
  .composer input:focus{outline:none;}
  .composer button{border-radius:0;}

  .hint{font-size:12px; color:var(--soil); opacity:0.65; margin-top:8px;}
  .hidden{display:none;}
  .footer-note{font-size:12px; color:var(--soil); opacity:0.6; margin-top:30px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="wordmark">Kisan <span>Dost</span></div>
    <div class="datestamp"><div id="datestamp"></div><label class="language-switch">Language <select id="languageSelect" onchange="setLanguage(this.value)"><option value="en">English</option><option value="ur">اردو</option></select></label></div>
  </div>

  <div class="setup" id="setupPanel">
    <h2>Set up your field, once</h2>
    <div class="field"><label>Your name</label><input id="f_name" placeholder="e.g. Abdul Rasheed"></div>
    <div class="grid2">
      <div class="field"><label>District</label><input id="f_district" placeholder="e.g. Multan"></div>
      <div class="field"><label>Crop</label>
        <select id="f_crop">
          <option value="wheat">Wheat</option>
          <option value="cotton">Cotton</option>
          <option value="rice">Rice</option>
          <option value="maize">Maize</option>
          <option value="sugarcane">Sugarcane</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Sowing date</label><input type="date" id="f_date"></div>
      <div class="field"><label>Land size (acres)</label><input type="number" id="f_acres" value="5"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Soil type</label>
        <select id="f_soil">
          <option value="loamy">Loamy</option>
          <option value="clay">Clay</option>
          <option value="sandy">Sandy</option>
          <option value="sandy-loam">Sandy-loam</option>
        </select>
      </div>
      <div class="field"><label>Water source</label>
        <select id="f_water"><option value="canal">Canal</option><option value="tube-well">Tube-well</option><option value="rain-fed">Rain-fed</option></select>
      </div>
    </div>
    <button onclick="registerFarmer()">Start Kisan Dost</button>
    <div class="hint">Backend expected at http://localhost:8000 — see README to run it.</div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="headline-card">
      <div class="headline-bar" id="urgencyBar">TODAY</div>
      <div class="headline-body">
        <h1 id="headlineText">Loading today's reminder…</h1>
        <p id="headlineReason"></p>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="k">CROP STAGE</div><div class="v" id="statStage">—</div></div>
      <div class="stat"><div class="k">DAYS SINCE SOWING</div><div class="v" id="statDays">—</div></div>
      <div class="stat"><div class="k">HARVEST</div><div class="v" id="statHarvest">—</div></div>
    </div>

    <div class="stage-track" id="stageTrack"></div>

    <div class="chat">
      <h2>Ask Kisan Dost</h2>
      <div class="log" id="chatLog"></div>
      <div class="composer">
        <input id="chatInput" placeholder="e.g. Should I irrigate today?" onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">Send</button>
      </div>
    </div>
    <div style="margin-top:14px;"><button class="secondary" onclick="resetFarmer()">Reset profile</button></div>
  </div>

  <div class="footer-note">Kisan Dost — built on the OpenAI Agents SDK. Guardrailed, session-aware, agronomy-grounded.</div>
</div>

<script>
const API = "http://localhost:8000";
document.getElementById('datestamp').textContent = new Date().toDateString();
const savedLanguage = localStorage.getItem('kisan_language') || 'en';
document.getElementById('languageSelect').value = savedLanguage;

function getLanguage(){ return localStorage.getItem('kisan_language') || 'en'; }
function setLanguage(language){
  localStorage.setItem('kisan_language', language);
  document.getElementById('chatInput').placeholder = language === 'ur'
    ? 'مثلاً: کیا آج آبپاشی کرنی چاہیے؟' : 'e.g. Should I irrigate today?';
}
setLanguage(savedLanguage);

function getFarmerId(){ return localStorage.getItem('kisan_farmer_id'); }

async function registerFarmer(){
  const farmer_id = 'f_' + Date.now();
  const payload = {
    farmer_id,
    name: document.getElementById('f_name').value || 'Farmer',
    district: document.getElementById('f_district').value || 'Multan',
    crop: document.getElementById('f_crop').value,
    sowing_date: document.getElementById('f_date').value || new Date().toISOString().slice(0,10),
    land_acres: parseFloat(document.getElementById('f_acres').value || '5'),
    soil_type: document.getElementById('f_soil').value,
    water_source: document.getElementById('f_water').value,
  };
  try{
    const res = await fetch(`${API}/farmer/register`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    if(!res.ok) throw new Error('registration failed');
    localStorage.setItem('kisan_farmer_id', farmer_id);
    localStorage.setItem('kisan_farmer_name', payload.name);
    localStorage.setItem('kisan_crop', payload.crop);
    showDashboard();
  }catch(e){
    alert('Could not reach the Kisan Dost backend at ' + API + '. Make sure it is running (see README).');
  }
}

function resetFarmer(){
  localStorage.removeItem('kisan_farmer_id');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('setupPanel').classList.remove('hidden');
}

async function showDashboard(){
  document.getElementById('setupPanel').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  await loadReminder();
}

async function loadReminder(){
  const farmer_id = getFarmerId();
  const res = await fetch(`${API}/reminder/today/${encodeURIComponent(farmer_id)}`);
  if(!res.ok){
    if(res.status === 404) resetFarmer();
    throw new Error('Could not load the saved farmer profile');
  }
  const data = await res.json();

  const urgency = data.irrigation.urgency;
  const bar = document.getElementById('urgencyBar');
  bar.className = 'headline-bar ' + urgency;
  bar.textContent = data.date + ' · ' + urgency.toUpperCase() + ' PRIORITY';

  document.getElementById('headlineText').textContent = data.headline;
  document.getElementById('headlineReason').textContent = data.irrigation.reason;

  document.getElementById('statStage').textContent = data.stage.stage_name;
  document.getElementById('statDays').textContent = data.stage.days_since_sowing;
  document.getElementById('statHarvest').textContent = data.harvest && data.harvest.is_ready_to_harvest
      ? 'Ready now' : (data.harvest ? `${data.harvest.days_to_harvest}d left` : '—');

  const track = document.getElementById('stageTrack');
  track.innerHTML = '';
  // We only know the current stage name/number/total from the API; render a simple progress track.
  for(let i=1;i<=data.stage.total_stages;i++){
    const seg = document.createElement('div');
    seg.className = 'stage-seg' + (i===data.stage.stage_number ? ' active' : (i<data.stage.stage_number ? ' done':''));
    seg.textContent = i===data.stage.stage_number ? data.stage.stage_name : ('Stage ' + i);
    track.appendChild(seg);
  }
}

function appendMsg(text, who){
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if(!message) return;
  appendMsg(message, 'user');
  input.value = '';
  const farmer_id = getFarmerId();
  try{
    const res = await fetch(`${API}/chat`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({farmer_id, message, language: getLanguage()})});
    if(!res.ok) throw new Error('chat request failed');
    const data = await res.json();
    appendMsg(data.reply, 'bot');
  }catch(e){
    appendMsg('Backend not reachable. Please check it is running.', 'bot');
  }
}

if(getFarmerId()){ showDashboard(); }
</script>
</body>
</html>
